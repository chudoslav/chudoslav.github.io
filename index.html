<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wife Reveal</title>
    <style>
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 10px;
            /* Applies the animation below: 4 seconds long, smooth, and loops forever */
            animation: breatheGlow 4s ease-in-out infinite;
        }

        /* This handles the pulsing glow effect */
        @keyframes breatheGlow {
            0% { 
                box-shadow: 0 4px 20px rgba(255, 255, 255, 0.08); 
            }
            50% { 
                box-shadow: 0 4px 40px rgba(255, 255, 255, 0.25); 
            }
            100% { 
                box-shadow: 0 4px 20px rgba(255, 255, 255, 0.08); 
            }
        }
    </style>
</head>
<body>

    <img src="image_34d47f.jpg" alt="Wife Reveal">

</body>
</html>
