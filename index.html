<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wife Reveal</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        
        /* The pill-style box in the top right corner */
        .counter-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1a1a1a;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #2a2a2a;
            font-size: 14px;
            font-weight: 500;
            color: #a0a0a0;
        }

        /* SVG Eye Icon styling */
        .eye-icon {
            width: 16px;
            height: 16px;
            fill: #a0a0a0;
        }

        /* The actual count number text */
        #count-text {
            color: #ffffff;
        }

        img.main-pic {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Top Right View Counter Box -->
    <div class="counter-box">
        <svg class="eye-icon" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        </svg>
        <span id="count-text">...</span>
    </div>

    <!-- Centered Image -->
    <img class="main-pic" src="image_34d47f.jpg" alt="Wife Reveal">

    <!-- Script to securely fetch and update the count -->
    <script>
        async function updateCounter() {
            try {
                // Uses a secure public counter API to increase the view count
                const response = await fetch('https://api.counterapi.dev/v1/chudoslav/wife_reveal/up');
                const data = await response.json();
                document.getElementById('count-text').innerText = data.value;
            } catch (error) {
                // Fallback text if the network acts up
                document.getElementById('count-text').innerText = "1";
            }
        }
        updateCounter();
    </script>

</body>
</html>
