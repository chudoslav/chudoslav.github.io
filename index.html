<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wife Reveal</title>
    <style>
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 10px;
            /* Applies the stronger animation */
            animation: intenseGlow 3s ease-in-out infinite;
        }

        /* A much stronger, wider colorful glow that won't get hidden */
        @keyframes intenseGlow {
            0% { 
                box-shadow: 0 0 20px rgba(0, 140, 255, 0.3); 
            }
            50% { 
                box-shadow: 0 0 60px rgba(0, 140, 255, 0.8); 
            }
            100% { 
                box-shadow: 0 0 20px rgba(0, 140, 255, 0.3); 
            }
        }
    </style>
</head>
<body>

    <img src="image_34d47f.jpg" alt="Wife Reveal">

</body>
</html>
